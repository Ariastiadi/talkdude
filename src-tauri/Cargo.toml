[package]
name = "talkdude"
version = "1.4.0"
description = "talkdude - multi-provider AI chat companion"
authors = ["Ariastiadi", "iamlooper (original Lumi AI)"]
edition = "2021"
license = "GPL-3.0-or-later"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "talkdude_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Rust crates are pinned to the same minor versions as the @tauri-apps NPM packages
# (the Tauri CLI refuses to build when they differ). Cargo.lock is committed too.
[build-dependencies]
tauri-build = { version = "~2.5.5", features = [] }

[dependencies]
tauri = { version = "~2.10.2", features = [] }
tauri-plugin-opener = "~2.5.3"
tauri-plugin-http = "~2.5.7"
tauri-plugin-fs = "~2.5.1"
# Keep Tauri's internal crates on the series that tauri 2.10 was released with;
# newer tauri-runtime 2.12 is not source-compatible with tauri 2.10.
tauri-runtime = "~2.10"
tauri-runtime-wry = "~2.10"
tauri-utils = "~2.8"
tauri-macros = "~2.5"
tauri-codegen = "~2.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
# Native on-device AI (llama.cpp). OpenMP off; on Android link libc++ statically.
llama-cpp-2 = { version = "=0.1.158", default-features = false, features = ["android-static-stdcxx"] }

[target.'cfg(target_os = "android")'.dependencies]
# Uses MediaStore API for public directory writes -- required because std::fs
# is blocked by Android scoped storage enforcement (API 29+). The
# legacy_storage_permission feature compiles in runtime permission request
# support for API 24-28 (Android 7-9).
tauri-plugin-android-fs = { version = "=28.1.0", features = ["legacy_storage_permission"] }


# Smaller release binaries (Tauri's recommended size settings).
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
