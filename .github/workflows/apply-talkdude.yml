# One-time: applies all talkdude changes on top of the original Lumi AI code,
# generates the new app icons and commits. Delete this file once it has run.
name: Install talkdude (one-time)

on:
  push:
    paths: ['.github/workflows/apply-talkdude.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether talkdude is already installed
        id: check
        run: |
          if [ -f NOTICE.md ] && grep -q talkdude NOTICE.md; then
            echo "talkdude is already installed, nothing to do."
            echo "done=1" >> "$GITHUB_OUTPUT"
          fi

