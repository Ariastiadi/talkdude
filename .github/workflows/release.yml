name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fast checks first: types, unit tests and an end-to-end run of the web build
  # with a mocked AI. A release is only published when these pass.
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Build web app
        run: bun run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: node tests/e2e.mjs

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf cmake clang libclang-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-linux-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-linux-

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Generate app icons
        run: bun run tauri icon app-icon.svg

      - name: Build Linux app
        run: |
          rm -rf src-tauri/target/release/bundle/
          bun run tauri build

      - name: Rename Linux artifacts
        run: |
          mkdir -p out
          cp src-tauri/target/release/bundle/deb/*.deb out/talkdude-linux-amd64.deb
          cp src-tauri/target/release/bundle/rpm/*.rpm out/talkdude-linux-x86_64.rpm
          cp src-tauri/target/release/bundle/appimage/*.AppImage out/talkdude-linux-amd64.AppImage
          ls -lh out/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: talkdude-linux
          path: out/*

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-windows-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-windows-

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Generate app icons
        run: bun run tauri icon app-icon.svg

      # llama.cpp (on-device AI) is compiled with CMake; its Rust bindings need libclang.
      - name: Point bindgen at LLVM
        shell: bash
        run: echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> $GITHUB_ENV

      - name: Build Windows app
        shell: bash
        run: |
          rm -rf src-tauri/target/release/bundle/
          bun run tauri build

      - name: Rename Windows artifacts
        shell: bash
        run: |
          mkdir -p out
          cp src-tauri/target/release/bundle/nsis/*.exe out/talkdude-windows-x64-setup.exe
          cp src-tauri/target/release/bundle/msi/*.msi out/talkdude-windows-x64.msi
          ls -lh out/

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: talkdude-windows
          path: out/*

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # The runner image already ships the Android SDK. Accept its licenses
      # directly (android-actions/setup-android@v3 hangs on the license prompt).
      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> $GITHUB_ENV
          SDKM="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin"
          echo "$SDKM" >> $GITHUB_PATH
          yes | "$SDKM/sdkmanager" --licenses > /dev/null || true

      - name: Install Android NDK
        run: |
          yes | sdkmanager --install "ndk;29.0.14206865" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
          echo "NDK_VERSION=29.0.14206865" >> $GITHUB_ENV
          # llama.cpp (native on-device AI) is built with the NDK's CMake toolchain.
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
          echo "ANDROID_API_LEVEL=24" >> $GITHUB_ENV

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-android-

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Install cargo-ndk
        run: command -v cargo-ndk >/dev/null 2>&1 || cargo install cargo-ndk

      - name: Set CARGO_HOME
        run: echo "CARGO_HOME=$HOME/.cargo" >> $GITHUB_ENV

      - name: Generate app icons
        run: bun run tauri icon app-icon.svg

      # Signing: uses the ANDROID_* repository secrets when they exist so every
      # release has the same signature (updates install over the old version).
      # Without secrets a throw-away keystore is generated so the build still
      # succeeds, but such APKs cannot update each other.
      - name: Prepare keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > src-tauri/gen/android/app/keystore.jks
            echo "Using keystore from secrets"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret; generating a temporary keystore"
            keytool -genkeypair -v -keystore src-tauri/gen/android/app/keystore.jks \
              -alias talkdude -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass talkdude-temp -keypass talkdude-temp \
              -dname "CN=talkdude temp, O=talkdude, C=ID"
            echo "ANDROID_KEYSTORE_PASSWORD=talkdude-temp" >> $GITHUB_ENV
            echo "ANDROID_KEY_PASSWORD=talkdude-temp" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=talkdude" >> $GITHUB_ENV
          fi

      - name: Build Android APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || env.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || env.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || env.ANDROID_KEY_ALIAS }}
        run: bun run tauri android build --apk --aab

      - name: Rename APKs
        run: |
          mkdir -p out
          while IFS= read -r apk; do
            filename=$(basename "$apk")
            [[ "$filename" == *-universal-release* ]] && continue
            renamed=$(echo "$filename" | sed 's/^app-universal-/talkdude-android-/' | sed 's/-release\././')
            cp "$apk" "out/$renamed"
          done < <(find src-tauri/gen/android/app/build/outputs/apk/ -name '*.apk' -type f)
          # App bundle for Google Play (upload it in Play Console).
          find src-tauri/gen/android/app/build/outputs/bundle/ -name '*.aab' -type f -exec cp {} out/talkdude-android-play.aab \; || true
          ls -lh out/

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: talkdude-android
          path: |
            out/*.apk
            out/*.aab

  # Apple Silicon Macs. Not signed with an Apple developer ID, so the first
  # launch needs right-click → Open. A failure here doesn't block the release.
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-macos-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-macos-

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Generate app icons
        run: bun run tauri icon app-icon.svg

      - name: Build macOS app
        env:
          # llama.cpp uses C++17 std::filesystem, available from macOS 10.15.
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          rm -rf src-tauri/target/release/bundle/
          bun run tauri build --bundles dmg

      - name: Rename macOS artifacts
        run: |
          mkdir -p out
          cp src-tauri/target/release/bundle/dmg/*.dmg out/talkdude-macos-arm64.dmg
          ls -lh out/

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: talkdude-macos
          path: out/*

  # Publishes a GitHub Release automatically. The tag is taken from a pushed
  # v* tag, or from "version" in src-tauri/tauri.conf.json on pushes to main
  # (so bumping the version = a new release; Obtainium picks it up).
  release:
    name: Create Release
    needs: [test, build-linux, build-windows, build-android, build-macos]
    # macOS is optional; everything else must pass.
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.build-linux.result == 'success' && needs.build-windows.result == 'success' && needs.build-android.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # APKs signed with a temporary key can't update existing installs, so never publish them.
      - name: Require the release signing key
        env:
          HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing; not publishing APKs that can't update existing installs."
            exit 1
          fi

      - name: Decide release tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v$(jq -r .version src-tauri/tauri.conf.json)"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          if [[ "$GITHUB_REF" != refs/tags/v* ]] && gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; bump the version in src-tauri/tauri.conf.json to publish a new one."
            echo "skip=1" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        if: steps.tag.outputs.skip != '1'
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        if: steps.tag.outputs.skip != '1'
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.msi' -o -name '*.exe' -o -name '*.apk' -o -name '*.aab' -o -name '*.dmg' \) -exec mv {} release/ \;
          ls -la release/

      - name: Create Release
        if: steps.tag.outputs.skip != '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: talkdude ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: release/*
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
