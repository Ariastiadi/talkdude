# One-time fix: show the github-actions bot commit (the 1.0.0 history cleanup)
# as Ariastiadi's, then delete this file. Run it once from the Actions tab.
name: Fix commit authors
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Rewrite authors
        env:
          FILTER_BRANCH_SQUELCH_WARNING: "1"
        run: |
          git fetch --tags --force
          git filter-branch -f --env-filter '
          BOT="41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$GIT_AUTHOR_EMAIL" = "$BOT" ]; then export GIT_AUTHOR_NAME="Ariastiadi Saleh Herutjakra" GIT_AUTHOR_EMAIL="mantjanegara1960@gmail.com"; fi
          if [ "$GIT_COMMITTER_EMAIL" = "$BOT" ]; then export GIT_COMMITTER_NAME="Ariastiadi Saleh Herutjakra" GIT_COMMITTER_EMAIL="mantjanegara1960@gmail.com"; fi
          ' --msg-filter 'sed -e "/^[Cc]o-[Aa]uthored-[Bb]y:/d" -e "/^Claude-Session:/d"' --tag-name-filter cat -- --branches --tags
          git config user.name "Ariastiadi Saleh Herutjakra"
          git config user.email "mantjanegara1960@gmail.com"
          git rm -q .github/workflows/fix-authors.yml
          git commit -q -m "Remove the one-time author fix"
          echo "Authors now:"
          git log --format='%an <%ae> | %cn <%ce>' | sort | uniq -c
          git push --force origin HEAD:main
          git push --force --tags
